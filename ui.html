<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --accent: #4261EE;
    --accent-soft: rgba(66, 97, 238, .14);
    --wip: #F59E0B;
    --review: #7C5CFF;
    --ready: #1BC47D;
    --warn: #B45309;
    --warn-bg: rgba(245, 158, 11, .14);
    --danger: #E5484D;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    font: 12px/1.45 Inter, system-ui, sans-serif;
    color: var(--figma-color-text); background: var(--figma-color-bg);
    -webkit-font-smoothing: antialiased;
  }
  body.loading { visibility: hidden; } /* avoids a language flash before saved prefs arrive */
  button, input, textarea { font: inherit; color: inherit; }

  header { flex: none; padding: 16px 16px 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { flex: none; width: 34px; height: 34px; border-radius: 10px; }
  .eyebrow {
    font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 2px;
  }
  .eyebrow small { font-size: 10px; letter-spacing: 0; text-transform: none; opacity: .7; font-weight: 500; }
  h1 { margin: 0; font-size: 15px; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; }

  .icon-btn {
    flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0;
    border: 0; border-radius: 7px; cursor: pointer; background: transparent;
    color: var(--figma-color-text-secondary); transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--figma-color-bg-hover); color: var(--figma-color-text); }
  .icon-btn svg { width: 16px; height: 16px; }

  .tabs { display: flex; gap: 16px; margin-top: 12px; border-bottom: 1px solid var(--figma-color-border); }
  .tabs button {
    padding: 8px 0; border: 0; background: none; cursor: pointer; font-weight: 600;
    color: var(--figma-color-text-secondary); border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tabs button:hover { color: var(--figma-color-text); }
  .tabs button.on { color: var(--figma-color-text); border-bottom-color: var(--accent); }

  main { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 16px; }
  .view { display: none; }
  body.view-spec #spec, body.view-overview #overview { display: block; }

  /* Selected target */
  .target {
    display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 10px;
    background: var(--figma-color-bg-secondary); border: 1px solid var(--figma-color-border);
  }
  .target .ico {
    flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent);
  }
  .target .ico svg { width: 16px; height: 16px; }
  .target .meta { min-width: 0; flex: 1; }
  .target .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .target .sub { color: var(--figma-color-text-secondary); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    flex: none; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: var(--figma-color-bg); border: 1px solid var(--figma-color-border); color: var(--figma-color-text-secondary);
  }

  .banner {
    display: none; margin-top: 10px; padding: 10px 12px; border-radius: 10px;
    background: var(--warn-bg); color: var(--warn);
  }
  .banner.show { display: block; }
  .banner b { display: block; margin-bottom: 2px; }
  .banner .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .banner.info { background: var(--accent-soft); color: var(--figma-color-text); }

  .field { margin-top: 16px; }
  .lbl { font-size: 11px; font-weight: 600; color: var(--figma-color-text-secondary); margin-bottom: 6px; }
  .hint { font-size: 11px; color: var(--figma-color-text-tertiary); margin-top: 4px; }

  /* Status segmented control */
  .seg {
    display: flex; padding: 3px; gap: 3px; border-radius: 10px;
    background: var(--figma-color-bg-secondary); border: 1px solid var(--figma-color-border);
  }
  .seg button {
    flex: 1; font-weight: 500; padding: 7px 4px; border: 0; border-radius: 7px; cursor: pointer;
    background: transparent; color: var(--figma-color-text-secondary); transition: all .15s;
    display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
  }
  .seg button:hover { color: var(--figma-color-text); }
  .seg button.on { color: #fff; font-weight: 600; }
  .seg button[data-status="wip"].on { background: var(--wip); }
  .seg button[data-status="review"].on { background: var(--review); }
  .seg button[data-status="ready"].on { background: var(--ready); }
  .seg button[data-lang].on { background: var(--accent); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.wip { background: var(--wip); } .dot.review { background: var(--review); } .dot.ready { background: var(--ready); }
  .seg button.on .dot { background: #fff; }

  /* Inputs */
  .input, textarea, .chips {
    width: 100%; border-radius: 8px; border: 1px solid var(--figma-color-border);
    background: var(--figma-color-bg); outline: none; transition: border-color .15s;
  }
  .input { padding: 7px 9px; }
  .input:focus, textarea:focus, .chips:focus-within { border-color: var(--accent); }
  textarea { padding: 8px 9px; min-height: 120px; resize: vertical; line-height: 1.5; }

  .owner { display: grid; grid-template-columns: 82px 1fr; align-items: start; gap: 8px; margin-bottom: 6px; }
  .owner > span { padding-top: 7px; color: var(--figma-color-text-secondary); }
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 4px; min-height: 32px; cursor: text; }
  .chip {
    display: inline-flex; align-items: center; gap: 2px; height: 22px; padding: 0 3px 0 8px; border-radius: 6px;
    background: var(--accent-soft); font-weight: 500; line-height: 1;
  }
  .chip span { display: block; line-height: 16px; white-space: nowrap; }
  .chip button {
    flex: none; width: 16px; height: 16px; padding: 0; border: 0; border-radius: 4px; cursor: pointer; background: none;
    color: var(--figma-color-text-secondary); display: grid; place-items: center;
  }
  .chip button svg { display: block; }
  .chip button:hover { background: var(--figma-color-bg-hover); color: var(--figma-color-text); }
  .chips input { flex: 1; min-width: 80px; height: 22px; border: 0; outline: none; background: none; padding: 0 4px; }

  .suggest {
    position: fixed; z-index: 4; display: none; max-height: 220px; overflow-y: auto; padding: 4px;
    border-radius: 9px; border: 1px solid var(--figma-color-border); background: var(--figma-color-bg);
    box-shadow: 0 6px 24px rgba(0, 0, 0, .14);
  }
  .suggest.show { display: block; }
  .sg-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    height: 28px; padding: 0 4px 0 8px; border-radius: 6px; cursor: pointer;
  }
  .sg-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sg-item:hover, .sg-item.on { background: var(--figma-color-bg-hover); }
  .sg-item button {
    flex: none; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 5px; cursor: pointer;
    background: none; color: var(--figma-color-text-tertiary); display: grid; place-items: center;
  }
  .sg-item button:hover { background: var(--figma-color-bg-secondary); color: var(--danger); }
  .link-row { display: flex; gap: 4px; margin-bottom: 6px; }
  .link-row .input { flex: 1; }
  .add {
    border: 1px dashed var(--figma-color-border-strong); background: none; border-radius: 8px; cursor: pointer;
    padding: 6px 10px; color: var(--figma-color-text-secondary); font-weight: 500; width: 100%; text-align: left;
  }
  .add:hover { color: var(--figma-color-text); background: var(--figma-color-bg-hover); }

  .btn {
    padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 600;
    border: 1px solid var(--figma-color-border); background: var(--figma-color-bg); transition: background .15s, filter .15s;
  }
  .btn:hover { background: var(--figma-color-bg-hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.primary:disabled { opacity: .5; cursor: default; filter: none; }
  .btn.ghost-danger { border-color: transparent; background: none; color: var(--danger); font-weight: 500; }
  .btn.ghost-danger:hover { background: rgba(229, 72, 77, .1); }
  .btn.small { padding: 4px 9px; font-size: 11px; }

  footer {
    flex: none; display: none; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 16px; border-top: 1px solid var(--figma-color-border);
  }
  body.view-spec.has-target footer { display: flex; }
  .info { min-width: 0; color: var(--figma-color-text-secondary); font-size: 11px; }
  .info div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot-actions { flex: none; display: flex; gap: 4px; }

  .placeholder {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 60px 24px; text-align: center;
  }
  body.no-target .placeholder { display: flex; }
  body.no-target #form { display: none; }
  .placeholder .big {
    width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 6px;
    background: var(--accent-soft); color: var(--accent);
  }
  .placeholder .big svg { width: 24px; height: 24px; }
  .placeholder b { font-size: 13px; }
  .placeholder span { color: var(--figma-color-text-secondary); }

  /* Overview */
  .counts { display: flex; gap: 6px; flex-wrap: wrap; }
  .counts button {
    display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--figma-color-border); background: var(--figma-color-bg); font-weight: 500;
  }
  .counts button b { font-variant-numeric: tabular-nums; }
  .counts button.on { border-color: var(--accent); background: var(--accent-soft); }
  .page-name {
    margin: 16px 0 6px; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--figma-color-text-tertiary);
  }
  .page-name small { text-transform: none; letter-spacing: 0; font-weight: 500; }
  .entry {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; margin-bottom: 4px;
    border-radius: 9px; border: 1px solid var(--figma-color-border); background: var(--figma-color-bg);
    cursor: pointer; text-align: left;
  }
  .entry:hover { background: var(--figma-color-bg-hover); }
  .entry .meta { flex: 1; min-width: 0; }
  .entry .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry .sub { font-size: 11px; color: var(--figma-color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ov-empty { padding: 40px 12px; text-align: center; color: var(--figma-color-text-secondary); }
  .ov-foot { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }

  /* Settings */
  .settings {
    position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column; background: var(--figma-color-bg);
  }
  body.settings-open .settings { display: flex; }
  .s-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--figma-color-border); }
  .s-head h2 { margin: 0; font-size: 14px; letter-spacing: -.01em; }
  .s-body { padding: 16px; display: flex; flex-direction: column; gap: 18px; }
  .s-ver { color: var(--figma-color-text-tertiary); font-size: 11px; }

  /* Confirm dialog */
  .confirm {
    position: fixed; inset: 0; z-index: 8; display: none; align-items: center; justify-content: center;
    padding: 24px; background: rgba(0, 0, 0, .35);
  }
  .confirm.show { display: flex; }
  .confirm .box {
    background: var(--figma-color-bg); border-radius: 12px; padding: 16px; max-width: 280px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
  }
  .confirm h3 { margin: 0 0 4px; font-size: 13px; }
  .confirm p { margin: 0; color: var(--figma-color-text-secondary); }
  .confirm .actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 14px; }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }

  /* Blocking screen shown when the installed version is outdated */
  .update {
    position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; padding: 32px; text-align: center;
    background: var(--figma-color-bg);
  }
  body.outdated .update { display: flex; }
  .update .big, .gate .big {
    width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; margin-bottom: 8px;
    background: var(--accent-soft); color: var(--accent);
  }
  .update .big svg, .gate .big svg { width: 28px; height: 28px; }
  .update h2, .gate h2 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
  .update p, .gate p { margin: 0; color: var(--figma-color-text-secondary); max-width: 250px; }
  .update .versions { font-variant-numeric: tabular-nums; font-size: 11px; margin-top: 2px; }
  .update a.btn { margin-top: 14px; background: var(--accent); border-color: var(--accent); color: #fff; text-decoration: none; }
  .update a.btn:hover { filter: brightness(1.08); }
  .update .how { margin-top: 10px; font-size: 11px; }

  /* Small language switch pinned to the bottom of the update / version-check screens */
  .lang-mini {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 11; display: none;
    padding: 2px; gap: 2px; border-radius: 8px;
    background: var(--figma-color-bg-secondary); border: 1px solid var(--figma-color-border);
  }
  body.checking .lang-mini, body.check-failed .lang-mini, body.outdated .lang-mini { display: flex; }
  .lang-mini button {
    font-size: 10px; font-weight: 600; line-height: 1; padding: 4px 9px; border: 0; border-radius: 6px;
    cursor: pointer; background: transparent; color: var(--figma-color-text-secondary); transition: all .15s;
  }
  .lang-mini button:hover { color: var(--figma-color-text); }
  .lang-mini button.on { background: var(--accent); color: #fff; }

  /* Gate shown while the version check runs, and when it can't complete */
  .gate {
    position: fixed; inset: 0; z-index: 9; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; padding: 32px; text-align: center;
    background: var(--figma-color-bg);
  }
  body.checking .gate, body.check-failed .gate { display: flex; }
  .gate .spinner {
    width: 26px; height: 26px; border-radius: 50%; margin-bottom: 8px;
    border: 3px solid var(--figma-color-bg-secondary); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .gate .big { display: none; }
  .gate .retry { display: none; margin-top: 14px; }
  body.check-failed .gate .spinner { display: none; }
  body.check-failed .gate .big { display: grid; }
  body.check-failed .gate .retry { display: block; }
  body.checking .gate .failed-only, body.check-failed .gate .checking-only { display: none; }
</style>
</head>
<body class="loading view-spec no-target">

    <div class="top">
      <div class="brand">
        <img class="logo" alt="">
        <div>
          <div class="eyebrow">Pyde Design <small id="ver"></small></div>
          <h1>Design Spec</h1>
        </div>
      </div>
      <button class="icon-btn" id="openSettings" data-i18n-title="settings">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4.5h6M11.5 4.5H14M2 11.5h2.5M8 11.5h6"/><circle cx="9.75" cy="4.5" r="1.75"/><circle cx="6.25" cy="11.5" r="1.75"/></svg>
      </button>

  <main>

        <div class="big"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 3l14 7-6 2-2 6L5 3z"/></svg></div>
        <b id="phTitle"></b>

function send(m) { parent.postMessage({ pluginMessage: m }, '*'); }

// ---------- People suggestions ----------
// Figma only tells plugins who has the file open right now, so the team roster lives in
// team.json in the GitHub repo. It is merged with the people the plugin finds in the file.
const TEAM_URL = 'https://raw.githubusercontent.com/tolgakutukcu/pydedesign-figma-claude-documentation/main/team.json';
let team = { design: [], dev: [], product: [] };
let filePeople = []; // [{ name, roles }] from code.js

async function loadTeam() {
  try {
    const res = await fetch(TEAM_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const j = await res.json();
    const list = (a) => (Array.isArray(a) ? a.filter((n) => typeof n === 'string' && n.trim()).map((n) => n.trim()) : []);
    team = { design: list(j.design), dev: list(j.development || j.dev), product: list(j.product) };
    renderPeople();
  } catch (e) {} // suggestions are a convenience, the plugin works without them
}

// Each role gets its own suggestion list: people known for that role first, then everyone else.
// Names from team.json can't be removed here (edit the file in the repo instead).
function suggestionsFor(role) {
  const first = [], rest = [];
  const has = (n) => first.indexOf(n) !== -1 || rest.indexOf(n) !== -1;
  const push = (arr, n) => { if (!has(n)) arr.push(n); };
  team[role].forEach((n) => push(first, n));
  filePeople.filter((p) => p.roles.indexOf(role) !== -1).forEach((p) => push(first, p.name));
  ['design', 'dev', 'product'].forEach((r) => team[r].forEach((n) => push(rest, n)));
  filePeople.forEach((p) => push(rest, p.name));
  const inTeam = (n) => ['design', 'dev', 'product'].some((r) => team[r].indexOf(n) !== -1);
  const fp = (n) => filePeople.find((p) => p.name === n);
  return first.concat(rest.sort((a, b) => a.localeCompare(b))).map((name) => ({
    name, removable: !inTeam(name) && !!fp(name) && fp(name).removable
  }));
}

function renderPeople() {
  if (suggest.input) showSuggest(suggest.input, suggest.role, suggest.box, suggest.commit);
}

// ---------- Suggestion dropdown ----------
// A custom list instead of <datalist>, so each name can have a remove button.
const suggest = { input: null, role: null, box: null, commit: null, items: [], active: -1 };

function hideSuggest() {
  suggest.input = null;
  suggest.active = -1;
  $('suggest').classList.remove('show');
}

function showSuggest(input, role, box, commit) {
  Object.assign(suggest, { input, role, box, commit });
  const q = input.value.trim().toLocaleLowerCase('tr');
  suggest.items = suggestionsFor(role)
    .filter((p) => form.owners[role].indexOf(p.name) === -1)
    .filter((p) => !q || p.name.toLocaleLowerCase('tr').indexOf(q) !== -1)
    .slice(0, 8);
  if (suggest.active >= suggest.items.length) suggest.active = suggest.items.length - 1;
  const el = $('suggest');
  el.innerHTML = '';
  if (!suggest.items.length) return el.classList.remove('show');
  suggest.items.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'sg-item' + (i === suggest.active ? ' on' : '');
    const name = document.createElement('span');
    name.textContent = p.name;
    row.append(name);
    // mousedown + preventDefault keeps focus in the input, so blur doesn't close the list first.
    row.onmousedown = (e) => { e.preventDefault(); input.value = p.name; commit(true); };
    if (p.removable) {
      const x = document.createElement('button');
      x.innerHTML = X;
      x.title = t().forget;
      x.onmousedown = (e) => {
        e.preventDefault();
        e.stopPropagation();
        filePeople = filePeople.filter((f) => f.name !== p.name);
        send({ type: 'forgetPerson', name: p.name });
        showSuggest(input, role, box, commit);
      };
      row.append(x);
    }
    el.append(row);
  });
  const r = box.getBoundingClientRect();
  el.style.left = r.left + 'px';
  el.style.width = r.width + 'px';
  el.classList.add('show');
  // Open upwards when there isn't enough room below.
  const below = window.innerHeight - r.bottom - 8;
  el.style.top = (below < el.offsetHeight && r.top > el.offsetHeight ? r.top - el.offsetHeight - 4 : r.bottom + 4) + 'px';
}

function emptyForm(me) {
  return { status: 'wip', owners: { design: me ? [me] : [], dev: [], product: [] }, jira: [], slack: [], notes: '' };
}
function formFromSpec(s) {
  return {
    status: s.status,
    owners: { design: s.owners.design.slice(), dev: s.owners.dev.slice(), product: s.owners.product.slice() },
    jira: s.jira.slice(), slack: s.slack.slice(), notes: s.notes
  };
}

function ago(ts) {
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return t().justNow;
  if (s < 3600) return Math.floor(s / 60) + t().minAgo;
  if (s < 86400) return Math.floor(s / 3600) + t().hAgo;
  return new Date(ts).toLocaleDateString(t().dateLocale);
}

function markDirty() {
  if (!dirty) { dirty = true; renderFooter(); }
}

// ---------- Form rendering ----------

function renderStatus() {
  document.querySelectorAll('#statusSeg button').forEach((b) => b.classList.toggle('on', b.dataset.status === form.status));
}

function renderChips() {
  document.querySelectorAll('.chips').forEach((box) => {
    const role = box.dataset.role;
    const keepFocus = box.contains(document.activeElement);
    box.innerHTML = '';
    form.owners[role].forEach((name, i) => {
      const c = document.createElement('span');
      c.className = 'chip';
      const label = document.createElement('span');
      label.textContent = name;
      c.append(label);
      const x = document.createElement('button');
      x.innerHTML = X;
      x.onclick = (e) => { e.stopPropagation(); form.owners[role].splice(i, 1); markDirty(); renderChips(); };
      c.append(x);
      box.append(c);
    });
    const input = document.createElement('input');
    const commit = (refocus) => {
      const v = input.value.trim().replace(/,$/, '').trim();
      if (v && form.owners[role].indexOf(v) === -1) { form.owners[role].push(v); markDirty(); }
      input.value = '';
      renderChips();
      if (refocus) box.querySelector('input').focus();
    };
    input.onkeydown = (e) => {
      const open = suggest.input === input && suggest.items.length;
      if (open && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
        e.preventDefault();
        const n = suggest.items.length;
        suggest.active = e.key === 'ArrowDown' ? (suggest.active + 1) % n : (suggest.active - 1 + n) % n;
        showSuggest(input, role, box, commit);
      } else if (e.key === 'Escape' && open) {
        e.preventDefault();
        hideSuggest();
      } else if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        if (open && suggest.active >= 0) input.value = suggest.items[suggest.active].name;
        commit(true);
      }
      else if (e.key === 'Backspace' && !input.value && form.owners[role].length) {
        form.owners[role].pop(); markDirty(); renderChips(); box.querySelector('input').focus();
      }
    };
    input.oninput = () => { suggest.active = -1; showSuggest(input, role, box, commit); };
    input.onfocus = () => showSuggest(input, role, box, commit);
    input.onblur = () => {
      if (suggest.input === input) hideSuggest();
      if (input.value.trim()) commit(false);
    };
    box.onclick = () => input.focus();
    box.append(input);
    if (keepFocus) input.focus();
  });
}

function renderLinks(kind) {
  const list = $(kind + 'List');
  list.innerHTML = '';
  form[kind].forEach((url, i) => {
    const row = document.createElement('div');
    row.className = 'link-row';
    const input = document.createElement('input');
    input.className = 'input';
    input.value = url;
    input.placeholder = kind === 'jira' ? 'https://yourteam.atlassian.net/browse/…' : 'https://yourteam.slack.com/archives/…';
    input.oninput = () => { form[kind][i] = input.value; markDirty(); };
    const x = document.createElement('button');
    x.className = 'icon-btn';
    x.innerHTML = X;
    x.onclick = () => { form[kind].splice(i, 1); markDirty(); renderLinks(kind); };
    row.append(input, x);
    list.append(row);
  });
}

function renderForm() {
  renderStatus();
  renderChips();
  renderLinks('jira');
  renderLinks('slack');
  $('notes').value = form.notes;
}

function renderFooter() {
  const s = editing && editing.spec;
  $('save').textContent = editing && editing.hasSpec ? t().save : t().create;
  $('save').disabled = saving || (editing && editing.hasSpec && !dirty);
  $('remove').style.display = editing && editing.hasSpec ? '' : 'none';
  $('upd').textContent = dirty ? t().unsaved
    : s && s.at ? t().lastUpdated + (s.by ? s.by + ' · ' : '') + ago(s.at) : t().notSaved;
}

function renderTarget(m) {
  $('targetIco').innerHTML = ICONS[m.target.kind];
  $('targetName').textContent = m.target.name;
  $('targetSub').textContent = m.target.kind + ' · ' + (m.target.section ? t().inSection(m.target.section) : m.target.page);
  $('badge').textContent = m.spec ? t().statusLong[m.spec.status] : t().noSpec;
}

// Fills the form from the plugin state, unless the user is mid-edit.
function render(m) {
  lastState = m;
  const body = document.body.classList;

  if (dirty && editing && !(m.status === 'ok' && m.target.id === editing.id)) {
    // Selection moved away while editing: keep the form bound to the original target.
    $('staleBanner').classList.add('show');
    $('staleText').textContent = t().staleText(editing.name);
    return;
  }
  $('staleBanner').classList.remove('show');

  if (m.status !== 'ok') {
    editing = null;
    body.add('no-target');
    body.remove('has-target');
    $('phTitle').textContent = m.status === 'multiple' ? t().multiTitle : t().emptyTitle;
    $('phText').textContent = m.status === 'multiple' ? t().multiText(m.count) : t().emptyText;
    return;
  }

  body.remove('no-target');
  body.add('has-target');
  renderTarget(m);

  const sameTarget = editing && editing.id === m.target.id;
  editing = { id: m.target.id, name: m.target.name, hasSpec: !!m.spec, spec: m.spec };
  // Don't redraw a form that is being typed into (it would reset the cursor).
  const typing = sameTarget && document.activeElement && $('form').contains(document.activeElement);
  if (!dirty && !typing) {
    form = m.spec ? formFromSpec(m.spec) : emptyForm(m.me);
    renderForm();
  }

  renderFooter();
}

function collect() {
  return {
    status: form.status,
    owners: form.owners,
    jira: form.jira,
    slack: form.slack,
    notes: $('notes').value
  };
}

function save() {
  if (!editing || saving) return;
  saving = true;
  renderFooter();
  send({ type: 'save', id: editing.id, spec: collect() });
}

// ---------- Overview ----------

function renderOverview() {
  if (!overview) return;
  const entries = overview.entries.slice().sort((a, b) => (b.at || 0) - (a.at || 0));
  const count = (s) => entries.filter((e) => s === 'all' || e.status === s).length;
  $('counts').innerHTML = '';
  ['all', 'wip', 'review', 'ready'].forEach((s) => {
    const b = document.createElement('button');
    b.className = filter === s ? 'on' : '';
    b.innerHTML = (s === 'all' ? '' : '<i class="dot ' + s + '"></i>') + '<span></span><b></b>';
    b.querySelector('span').textContent = s === 'all' ? t().all : t()[s];
    b.querySelector('b').textContent = count(s);
    b.onclick = () => { filter = s; renderOverview(); };
    $('counts').append(b);
  });

  const list = $('ovList');
  list.innerHTML = '';
  const shown = entries.filter((e) => filter === 'all' || e.status === filter);
  if (!shown.length) {
    const d = document.createElement('div');
    d.className = 'ov-empty';
    d.textContent = entries.length ? t().ovEmptyFilter : t().ovEmpty;
    list.append(d);
    return;
  }
  // Current page first, then the rest alphabetically.
  const pages = [];
  shown.forEach((e) => { if (pages.indexOf(e.pageId) === -1) pages.push(e.pageId); });
  const pageName = (id) => (shown.find((e) => e.pageId === id) || {}).pageName || '';
  pages.sort((a, b) => (a === overview.currentPageId ? -1 : b === overview.currentPageId ? 1 : pageName(a).localeCompare(pageName(b))));
  pages.forEach((pid) => {
    const h = document.createElement('div');
    h.className = 'page-name';
    h.textContent = pageName(pid);
    if (pid === overview.currentPageId) {
      const small = document.createElement('small');
      small.textContent = ' · ' + t().current;
      h.append(small);
    }
    list.append(h);
    shown.filter((e) => e.pageId === pid).forEach((e) => {
      const b = document.createElement('button');
      b.className = 'entry';
      b.innerHTML = '<i class="dot ' + e.status + '"></i><div class="meta"><div class="name"></div><div class="sub"></div></div>';
      b.querySelector('.name').textContent = e.name;
      b.querySelector('.sub').textContent = t().statusLong[e.status] + (e.at ? ' · ' + (e.by ? e.by + ' · ' : '') + ago(e.at) : '');
      b.onclick = () => { send({ type: 'goto', id: e.id }); setView('spec'); };
      list.append(b);
    });
  });
}

function setView(v) {
  view = v;
  document.body.classList.toggle('view-spec', v === 'spec');
  document.body.classList.toggle('view-overview', v === 'overview');
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.view === v));
  if (v === 'overview') send({ type: 'overview' });
}

// ---------- Language ----------

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t()[el.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-title]').forEach((el) => { el.title = t()[el.dataset.i18nTitle]; });
  document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => { el.placeholder = t()[el.dataset.i18nPlaceholder]; });
  document.querySelectorAll('[data-lang]').forEach((b) => b.classList.toggle('on', b.dataset.lang === lang));
  $('sVer').textContent = t().version + ' ' + VERSION + (remoteVersion ? '  ·  GitHub: v' + remoteVersion : '');
  if (latestVersion) $('versions').textContent = t().installed + ': v' + VERSION + '  ·  ' + t().latest + ': v' + latestVersion;
  render(lastState);
  renderFooter();
  renderOverview();
}

// ---------- Version check (same mechanism as the Handoff Pre Checklist plugin) ----------

// Returns true if version a is older than b (e.g. '1.0.0' < '1.1.0').
function isOlder(a, b) {
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++) {
    const x = pa[i] || 0, y = pb[i] || 0;
    if (x !== y) return x < y;
  }
  return false;
}

// The version check is mandatory: the plugin stays behind a gate until it succeeds.
// If the check can't complete (offline, GitHub unreachable, bad response) the gate stays up with a retry button.
// A silent re-check (periodic, while the plugin stays open) only blocks when it positively finds a newer
// version; a failed silent check is ignored so a brief network blip doesn't interrupt someone mid-work.
async function checkVersion(silent) {
  const cl = document.body.classList;
  if (!silent) {
    cl.remove('check-failed', 'outdated');
    cl.add('checking');
  }
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    const res = await fetch(VERSION_URL + '?t=' + Date.now(), { signal: ctrl.signal, cache: 'no-store' });
    clearTimeout(timer);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const latest = (await res.json()).version;
    if (typeof latest !== 'string' || !/^\d+\.\d+\.\d+$/.test(latest)) throw new Error('Bad version');
    remoteVersion = latest;
    console.log('[Pyde spec] installed v' + VERSION + ', GitHub v' + latest);
    if (isOlder(VERSION, latest)) {
      latestVersion = latest;
      cl.add('outdated');
    }
    applyLang();
    cl.remove('checking');
  } catch (e) {
    if (!silent) {
      cl.remove('checking');
      cl.add('check-failed');
    }
  }
}
$('retry').onclick = () => checkVersion();
setInterval(() => checkVersion(true), 5 * 60 * 1000);

// ---------- Events ----------

document.querySelectorAll('.tabs button').forEach((b) => { b.onclick = () => setView(b.dataset.view); });
document.querySelectorAll('#statusSeg button').forEach((b) => {
  b.onclick = () => { form.status = b.dataset.status; markDirty(); renderStatus(); };
});
document.querySelectorAll('[data-add]').forEach((b) => {
  b.onclick = () => {
    const kind = b.dataset.add;
    form[kind].push('');
    markDirty();
    renderLinks(kind);
    const inputs = $(kind + 'List').querySelectorAll('input');
    inputs[inputs.length - 1].focus();
  };
});
document.querySelector('main').addEventListener('scroll', () => { if (suggest.input) suggest.input.blur(); });
$('notes').oninput = () => { form.notes = $('notes').value; markDirty(); };
$('save').onclick = save;
$('discard').onclick = () => { dirty = false; editing = null; render(lastState); send({ type: 'refresh' }); };
$('remove').onclick = () => $('confirm').classList.add('show');
$('cancelRemove').onclick = () => $('confirm').classList.remove('show');
$('confirmRemove').onclick = () => {
  $('confirm').classList.remove('show');
  if (editing) { dirty = false; send({ type: 'remove', id: editing.id }); }
};
$('scanAll').onclick = () => {
  $('scanAll').textContent = t().scanning;
  $('scanAll').disabled = true;
  send({ type: 'scanAll' });
};
$('openSettings').onclick = () => document.body.classList.add('settings-open');
$('closeSettings').onclick = () => document.body.classList.remove('settings-open');
document.querySelectorAll('[data-lang]').forEach((b) => {
  b.onclick = () => { lang = b.dataset.lang; send({ type: 'setLang', lang }); applyLang(); };
});
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') save();
});

onmessage = (e) => {
  const m = e.data.pluginMessage;
  if (!m) return;
  if (m.type === 'prefs') {
    lang = m.lang === 'tr' ? 'tr' : 'en';
    applyLang();
    document.body.classList.remove('loading');
  } else if (m.type === 'state') {
    // While saving, keep the form as it is; the state that follows 'saved' fills it in.
    if (saving) { lastState = m; return; }
    render(m);
  } else if (m.type === 'saved') {
    saving = false;
    dirty = false;
  } else if (m.type === 'people') {
    filePeople = m.people || [];
    renderPeople();
  } else if (m.type === 'overview') {
    overview = m;
    $('scanAll').textContent = t().scanAll;
    $('scanAll').disabled = false;
    renderOverview();
  } else if (m.type === 'error') {
    saving = false;
    $('scanAll').textContent = t().scanAll;
    $('scanAll').disabled = false;
    renderFooter();
  }
};
